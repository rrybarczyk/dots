# AeroSpace window manager config
# Keybindings matched to niri's seamless scrolling model
#
# Layer 1: Opt+H/J/K/L           → focus within workspace
# Layer 2: Opt+Ctrl+H/J/K/L      → move window within workspace
# Layer 3: Opt+Shift+H/L         → slide to prev/next workspace
# Layer 4: Opt+Shift+Ctrl+H/L    → move window to prev/next workspace
#
# Ctrl+H/J/K/L is reserved for vim-tmux-navigator (no conflicts)

config-version = 2

start-at-login = true

# -- Niri-like defaults --
# Accordion = niri's scrollable column layout
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

# Peek padding for neighboring windows in accordion mode
accordion-padding = 30

# Disable normalization so accordion layout stays intact
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Move mouse to focused monitor (niri does this automatically)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Define persistent workspaces so next/prev navigation works
# These always exist even when empty
persistent-workspaces = ["1", "2", "3", "4", "5"]

[key-mapping]
preset = 'qwerty'

# -- Gaps (matches niri default 8px) --
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# =============================================================================
# Main mode
# =============================================================================
[mode.main.binding]

# -- Focus window / seamless slide (niri-like continuous scrolling) --
# H/L: focus within workspace, if at edge slide to prev/next workspace
alt-h = 'exec-and-forget ~/.config/aerospace/scripts/focus-or-slide.sh left'
alt-l = 'exec-and-forget ~/.config/aerospace/scripts/focus-or-slide.sh right'
alt-j = 'focus down'
alt-k = 'focus up'

# -- Move window within workspace (niri: Mod+Ctrl+H/J/K/L) --
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# -- Slide to prev/next workspace (seamless like niri scrolling) --
alt-shift-h = 'workspace prev'
alt-shift-l = 'workspace next'

# -- Focus other monitor (for external displays) --
alt-shift-j = 'focus-monitor --wrap-around next'
alt-shift-k = 'focus-monitor --wrap-around prev'

# -- Move window to prev/next workspace --
alt-shift-ctrl-h = 'move-node-to-workspace prev'
alt-shift-ctrl-l = 'move-node-to-workspace next'

# -- Move window to other monitor --
alt-shift-ctrl-j = 'move-node-to-monitor --wrap-around next'
alt-shift-ctrl-k = 'move-node-to-monitor --wrap-around prev'

# -- Close window (niri: Mod+Q) --
alt-q = 'close'

# -- Minimize window (macOS native minimize) --
alt-m = 'macos-native-minimize'

# -- Fullscreen / maximize (niri: Mod+F) --
alt-f = 'fullscreen'

# -- Toggle floating (niri: Mod+V) --
alt-v = 'layout floating tiling'

# -- Resize (niri: Mod+Minus/Equal) --
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# -- Cycle preset column widths (niri: Mod+R) --
# Cycles through 1/2, 2/3, 1/3 of screen width
alt-r = 'exec-and-forget ~/.config/aerospace/scripts/cycle-width.sh'

# -- Layout toggle: accordion (niri-like) vs tiles (niri: Mod+W) --
alt-w = 'layout accordion tiles'

# -- Consume/expel windows between containers (niri: Mod+Comma/Period) --
alt-comma  = 'join-with left'
alt-period = 'join-with right'

# -- Workspace back-and-forth --
alt-tab = 'workspace-back-and-forth'

# -- Move workspace to another monitor --
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# -- Open terminal (niri: Mod+T) --
alt-t = 'exec-and-forget open -a Alacritty'

# -- Show all windows / Mission Control (niri: Mod+O overview) --
alt-o = 'exec-and-forget open -b com.apple.exposelauncher'

# -- Service mode --
alt-shift-semicolon = 'mode service'

# =============================================================================
# Service mode (Opt+Shift+; to enter, Esc to exit)
# =============================================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
