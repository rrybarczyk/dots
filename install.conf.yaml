- defaults:
    link:
        create: true
        relink: true
        force: true

- clean:
        - '~'
        - ~/.config
        - ~/.ssh
        - ~/app

- shell:
        - mkdir -p ~/.config
        - mkdir -p ~/.config/alacritty
        - mkdir -p ~/.config/nvim
        - mkdir -p ~/.config/nvim/colors
        - mkdir -p ~/.config/aerospace
        - mkdir -p ~/.ssh
        - chmod +x ~/.dots/scripts/agentctl ~/.dots/scripts/agents
        - chmod +x ~/.dots/etc/aerospace/scripts/focus-or-slide.sh ~/.dots/etc/aerospace/scripts/cycle-width.sh

- link:
        ~/.config/alacritty/alacritty.toml:     etc/alacritty.toml
        ~/.config/git/config:                   etc/gitconfig
        ~/.config/nvim/init.vim:                etc/nvim/init.vim
        ~/.config/aerospace:                    etc/aerospace
        # ~/.config/.secrets:                     etc/secrets
        # ~/.ssh/config:                          etc/ssh-config
        ~/.tmux.conf:                           etc/tmux.conf
        ~/.zshenv:                              etc/zshenv
        ~/.zshrc:                               etc/zshrc
        ~/.oh-my-zsh/oh-my-zsh.sh:              etc/oh-my-zsh.sh
